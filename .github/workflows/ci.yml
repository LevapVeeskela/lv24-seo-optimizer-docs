name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# QA-10: a new push to the same branch cancels the previous run instead of queueing
# duplicate builds; the docs site is published from main only.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_SITE_URL: https://seo.lv24.by
    steps:
      # QA-09: pinned by commit SHA, so a moving major tag cannot change the build
      # silently. Bump the SHA and the trailing comment together in a reviewed change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run docs:build
